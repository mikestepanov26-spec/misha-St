<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — My first site?</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <nav class="navbar navbar-expand-sm border-bottom sticky-top site-nav">
    <div class="container">
      <div class="navbar-nav me-auto flex-row gap-3">
        <a class="nav-link" href="index.html">Главная</a>
        <a class="nav-link" href="about.html">О сайте</a>
        <a class="nav-link active fw-semibold" href="contacts.html">Контакты</a>
      </div>
      <button id="theme" type="button" class="btn btn-sm btn-outline-secondary">
        Тёмная тема
      </button>
    </div>
  </nav>

  <main class="container my-5" style="max-width: 640px;">
    <h1 class="h3 mb-3">Мои контакты</h1>
    <p class="text-secondary mb-4">
      Заполни форму ниже — JavaScript проверит поля и email без перезагрузки страницы.
    </p>

    <form id="contactForm" class="card p-4 shadow-sm" novalidate>
      <div class="mb-3">
        <label for="name" class="form-label">Имя</label>
        <input id="name" type="text" class="form-control" placeholder="Как тебя зовут?">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" type="email" class="form-control" placeholder="example@mail.ru">
      </div>
      <div class="mb-3">
        <label for="comment" class="form-label">Сообщение</label>
        <textarea id="comment" class="form-control" rows="4" placeholder="Напиши что-нибудь..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Отправить</button>
      <p id="formMessage" class="mt-3 mb-0 fw-semibold"></p>
    </form>
  </main>

  <footer class="text-center py-4 border-top mt-5">
    <p class="mb-0 text-secondary">2026 ВГУ</p>
  </footer>
</body>
</html>
