    main { max-width: 1120px; margin: 14px auto 0; padding: 26px 24px 24px; background: #fff; border: 1px solid #dce3ec; border-radius: 16px; }

    p { margin: 0 0 18px; font-size: 16px; line-height: 1.5; }
    a { color: #06f; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    .button { display: inline-block; padding: 11px 14px; background: #1670f8; color: white; border-radius: 7px; text-decoration: none; }
    .button.secondary { background: white; color: #1670f8; border: 1px solid #1670f8; }
    footer { max-width: 1120px; margin: 74px auto 0; padding: 0 0 30px; color: #111827; }
    @media (max-width: 1160px) { main, footer { margin-left: 20px; margin-right: 20px; } }
